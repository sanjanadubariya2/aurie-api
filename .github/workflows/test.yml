name: test
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # Add TEST_MONGODB_URI in GitHub > Settings > Secrets and variables >
      # Actions. It must end in /aurie_test — tests/setup.js refuses any other
      # database. Without it the suite is skipped (lint still runs).
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests
        if: env.TEST_MONGODB_URI != ''
        run: npm test
      - name: Tests skipped
        if: env.TEST_MONGODB_URI == ''
        run: echo "::notice::TEST_MONGODB_URI secret not set — API tests skipped."
